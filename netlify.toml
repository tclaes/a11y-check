[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[functions."analyse"]
  node_bundler = "esbuild"
  external_node_modules = ["@sparticuz/chromium", "axe-core"]
  timeout = 26

# Production branch
[context.main]
  publish = "."

# Develop branch — persistent preview at develop--a11y-check.netlify.app
[context.develop]
  publish = "."

# Deploy previews — created automatically for every PR
[context.deploy-preview]
  publish = "."
